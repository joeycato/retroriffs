[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/stuff/my50stv/*"
  to = "/stuff/my-retro-tvs/#1950s"
  status = 301
  force = true

